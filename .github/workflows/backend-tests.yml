name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check backend formatting
        run: ruff format --check app tests
      - name: Lint backend
        run: ruff check app tests
      - name: Check Python build
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: pytest -q
      - name: Validate 500-user read and submission targets
        env:
          DATABASE_URL: sqlite:///./load-test.db
          DATABASE_POOL_SIZE: 15
          DATABASE_MAX_OVERFLOW: 5
          DEMO_PASSWORD: DemoPass!2026
          SECRET_KEY: LocalDemoOnly-Secret-Key-For-CI-Only-2026
          LOAD_TEST_EMAIL: demo.admin@example.com
          LOAD_TEST_PASSWORD: DemoPass!2026
        run: |
          python -m scripts.demo_seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 16 > /tmp/scms-load-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
            cat /tmp/scms-load-test.log
            exit 1
          fi
          python scripts/load_test.py --base-url http://127.0.0.1:8000 --concurrency 500 --requests 500 --submit-count 5
